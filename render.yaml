services:
  - type: web
    name: devtinder
    runtime: node
    plan: free
    buildCommand: >-
      npm ci &&
      git init web &&
      git -C web fetch https://github.com/Sanku1299/devTinder-web.git ca524ba5846367cf08ef2c17b70755e0f9385dac &&
      git -C web reset --hard FETCH_HEAD &&
      npm ci --prefix web --include=dev &&
      npm run build --prefix web
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
